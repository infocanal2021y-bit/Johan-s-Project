<!doctype html>
<html lang="es" translate="no" class="notranslate">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="google" content="notranslate" />
        <meta http-equiv="Content-Language" content="es" />
        <meta name="description" content="LIONSBIT VERIFICACION - Plataforma de Verificacion Digital" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>LIONSBIT VERIFICACION | Plataforma de Verificacion Digital</title>
        <script>
            // Prevent browser translation tools from causing React re-render loops.
            // Google Translate wraps text nodes in <font> tags, which mutates the DOM
            // and can trigger React's reconciliation into an infinite loop.
            (function() {
                var observer = new MutationObserver(function(mutations) {
                    for (var i = 0; i < mutations.length; i++) {
                        var m = mutations[i];
                        if (m.type === 'childList') {
                            for (var j = 0; j < m.addedNodes.length; j++) {
                                var node = m.addedNodes[j];
                                if (node.tagName === 'FONT' && node.classList && node.classList.contains('notranslate') === false) {
                                    // Google Translate injected a <font> tag - unwrap it
                                    while (node.firstChild) {
                                        node.parentNode.insertBefore(node.firstChild, node);
                                    }
                                    node.parentNode.removeChild(node);
                                }
                            }
                        }
                    }
                });

                document.addEventListener('DOMContentLoaded', function() {
                    var root = document.getElementById('root');
                    if (root) {
                        observer.observe(root, { childList: true, subtree: true });
                    }
                });
            })();
        </script>
    </head>
    <body>
        <noscript>Necesitas habilitar JavaScript para usar esta aplicacion.</noscript>
        <div id="root" translate="no" class="notranslate"></div>
        <div id="portal-root" translate="no" class="notranslate"></div>
    </body>
</html>
